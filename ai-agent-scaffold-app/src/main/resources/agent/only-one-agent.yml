ai:
  agent:
    config:
      tables:
        testAgent03:
          app-name: testAgent
          agent:
            agent-id: 100003
            agent-name: 单一智能体
            agent-desc: 单一智能体
          module:
            ai-api:
              base-url: https://api.xiaomimimo.com
              api-key: "${MIMO_API_KEY:sk-c091smhwck8oquky5rrly5qd4zwhthvczdl3sz7thd9or79r}"
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: mimo-v2.5
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: https://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: sse?api_key=${BAIDU_SEARCH_MCP_API_KEY:}
                    request-timeout: 5000
                - sse:
                    name: baidu-map
                    base-uri: https://mcp.map.baidu.com/
                    sse-endpoint: sse?ak=${BAIDU_MAP_MCP_AK:}
                    request-timeout: 5000
                - local:
                    name: myToolCallbackProvider
              tool-skills-list:
                - type: resource
                  path: agent/skills
            agents:
              - name: onlyAgent
                description: 小傅哥学习项目计划
                instruction: |
                  通过百度检索小傅哥编程实战项目，并根据检索内容，针对初学者用户给出学习计划
                

            runner:
              agent-name: onlyAgent
              plugin-name-list:
                - myTestPlugin
                - myLogPlugin
